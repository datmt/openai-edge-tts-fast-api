[project]
name = "openai-edge-tts"
version = "0.1.0"
description = "Free Azure TTS replacement for OpenAI's TTS API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "edge-tts>=6.1.0",
    "python-dotenv>=1.0.0",
    "emoji>=2.14.0",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "httpx>=0.27.0",
]
